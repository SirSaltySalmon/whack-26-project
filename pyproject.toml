# Tool configuration only. Dependencies live in requirements.txt and requirements-dev.txt.
[tool.pytest.ini_options]
testpaths = ["brain/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["overlay"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["brain", "shared", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
